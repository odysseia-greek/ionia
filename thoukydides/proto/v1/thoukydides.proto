syntax = "proto3";

package thoukydides.v1;
option go_package = "github.com/odysseia-greek/ionia/thoukydides/gen/go/v1;thoukydidesv1";

import "google/protobuf/empty.proto";

service ThoukydidesService {
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
  rpc Options(google.protobuf.Empty) returns (ChapterOptions);
  rpc GetChapter(GetChapterRequest) returns (Chapter);
  rpc CheckChapter(CheckChapterRequest) returns (CheckChapterResponse);
}

message HealthResponse {
  bool healthy = 1;
  string time = 2;
  string version = 3;
}

message ChapterOption {
  string chapter = 1;
  string title = 2;
  int32 order = 3;
  int32 level = 4;
}

message ChapterOptions { repeated ChapterOption chapters = 1; }

message GetChapterRequest { string chapter = 1; }

message Chapter {
  string chapter = 1;
  string title = 2;
  int32 order = 3;
  int32 level = 4;
  string blob = 5;
  repeated Grammar grammar = 6;
  repeated Vocabulary vocabulary = 7;
  repeated ChapterText texts = 8;
}

message GrammarExample {
  string greek = 1;
  string translation = 2;
  string note = 3;
}

message Grammar {
  string grammar = 1;
  string title = 2;
  string explanation = 3;
  GrammarExample example = 4;
}

message Vocabulary {
  string greek = 1;
  string translation = 2;
}

message TextSource {
  string author = 1;
  string work = 2;
  string reference = 3;
  string dialect = 4;
}

message ChapterText {
  string text = 1;
  string title = 2;
  string type = 3;
  TextSource source = 4;
  string greek = 5;
  repeated string reading_hints = 6;
}

message ChapterAnswer {
  string text = 1;
  string learner_text = 2;
}

message CheckChapterRequest {
  string chapter = 1;
  repeated ChapterAnswer answers = 2;
}

message CheckedText {
  string text = 1;
  string source_text = 2;
  string actual_text = 3;
  string learner_text = 4;
}

message CheckChapterResponse {
  string chapter = 1;
  repeated CheckedText texts = 2;
}
